<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>預訂商品記錄</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🐰 預訂商品記錄</h1>
  <div class="actions">
    <label class="btn primary" id="aiFileBtn">📷 截圖自動新增<input type="file" id="aiFile" accept="image/*" multiple hidden></label>
    <button id="btnLink" class="primary" hidden>🔗 貼連結新增</button>
    <button id="btnAdd">＋ 手動新增</button>
    <button id="btnTg" title="Telegram 通知">🔔 通知</button>
    <button id="btnExport">匯出備份</button>
    <label class="btn">匯入備份<input type="file" id="fileImport" accept="application/json" hidden></label>
  </div>
</header>

<main>
  <nav class="tabs">
    <button data-tab="order" class="on">📦 我的訂單</button>
    <button data-tab="wish">💭 想預訂 <span id="wishCount" class="pill"></span></button>
  </nav>

  <section id="summary" class="summary"></section>

  <section class="filters">
    <input id="q" type="search" placeholder="搜尋商品、訂單編號、備註…">
    <select id="fPlatform"><option value="">全部店舖</option></select>
    <select id="fPickup"><option value="">全部取貨地點</option></select>
    <select id="fStatus"><option value="">全部狀態</option></select>
    <select id="fCur"><option value="">全部幣別</option><option>HKD</option><option>JPY</option></select>
    <select id="sort">
      <option value="ship">按預計發貨排序</option>
      <option value="order">按下單日期（新→舊）</option>
      <option value="total">按金額（高→低）</option>
    </select>
    <label class="chk"><input type="checkbox" id="showCancelled"> 顯示已取消</label>
    <div class="view">
      <button data-view="grid" class="on">卡片</button><button data-view="table">表格</button>
    </div>
  </section>

  <section id="list" class="grid"></section>
  <p id="empty" class="empty" hidden>沒有符合條件的商品</p>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="dlgHead"><h2 id="dlgTitle">新增商品</h2><button type="button" id="dlgX" class="xbtn" aria-label="關閉">✕</button></div>
    <div class="photos">
      <div id="photoPreview" class="thumbs"></div>
      <div class="photoBtns">
        <label class="btn">📷 上傳照片（可多張）<input type="file" id="photoFile" accept="image/*" multiple hidden></label>
        <button type="button" id="photoFind">搵官方圖</button>
        <button type="button" id="photoUrl">貼上圖片網址</button>
      </div>
    </div>
    <label class="wide">商品名稱<input name="name" required></label>
    <label>購買平台 / 店舖<input name="platform" list="platforms"></label>
    <datalist id="platforms"></datalist>
    <label class="orderOnly">訂單編號<input name="orderNo"></label>
    <label class="orderOnly">下單日期<input name="orderDate" type="text" placeholder="2026-10-23"></label>
    <label class="wishOnly">預訂截止（香港時間，時間可留空）<span class="dt"><input name="deadline" type="date"><input name="deadlineTime" type="time"></span></label>
    <label class="wide">⏰ 提醒時間（香港時間，Telegram 會喺 15 分鐘前同夠鐘時通知）<input name="remindAt" type="datetime-local"></label>
    <label>預計發貨 / 發售<input name="shipDate" placeholder="2027-01 或 2027年01月"></label>
    <label>數量<input name="qty" type="number" min="1" value="1" required></label>
    <label>幣別<select name="currency"><option>JPY</option><option>HKD</option><option>CNY</option><option>TWD</option><option>USD</option></select></label>
    <label>單價<input name="price" type="number" min="0" step="any" required></label>
    <label class="orderOnly">運費<input name="shipping" type="number" min="0" step="any" value="0"></label>
    <label>狀態<select name="status"></select></label>
    <label class="wide orderOnly">取貨 / 配送方式<input name="delivery"></label>
    <label class="wide">🛒 預訂 / 購買網址<input name="orderUrl" type="url" placeholder="官方商店或代購嘅商品頁 https://…"></label>
    <label class="wide">相關連結（原帖 / 資料來源）<input name="link" type="url" placeholder="https://…"></label>
    <label class="wide">備註 / 詳細資訊<textarea name="notes" rows="3" placeholder="款式、尺寸、商品連結、收件資料…"></textarea></label>
    <div class="formBtns">
      <button type="button" id="btnDelete" class="danger">刪除</button>
      <span class="grow"></span>
      <button type="button" id="btnCancel">取消</button>
      <button type="submit" class="primary" value="ok">儲存</button>
    </div>
  </form>
</dialog>

<dialog id="aiBusy" class="busy">
  <div class="spinner"></div>
  <p><b>AI 分析緊，同時上網搵商品資料同相…</b></p>
  <p class="meta">大約需要 1–3 分鐘，請唔好關閉呢個頁面。</p>
</dialog>

<dialog id="linkDlg">
  <form id="linkForm" method="dialog" class="linkForm">
    <h2>🔗 貼連結新增想預訂商品</h2>
    <label class="wide">帖文 / 商品連結<input name="link" type="url" placeholder="https://www.instagram.com/p/…" required></label>
    <label class="wide">截圖（可選，Instagram 要登入先睇到時有用）<input name="shots" type="file" accept="image/*" multiple></label>
    <label class="wide">補充（可選）<input name="hint" placeholder="例如：想要藍色款"></label>
    <p class="meta wide">AI 會打開連結、上網搵官方資料同相，大約 1–3 分鐘。</p>
    <div class="formBtns"><span class="grow"></span><button type="button" id="linkCancel">取消</button><button type="submit" class="primary" value="ok">開始搵資料</button></div>
  </form>
</dialog>

<dialog id="lightbox"><img id="lbImg" alt=""><button id="lbClose">✕</button></dialog>

<script src="app.js"></script>
</body>
</html>
